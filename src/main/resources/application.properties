spring.application.name=weather-app
api.key=${OPENWEATHER_API_KEY:}
geocoding.url=https://api.openweathermap.org/geo/1.0/direct
weather.url=https://api.openweathermap.org/data/2.5/weather
hourly_4days.url=https://api.openweathermap.org/data/2.5/forecast
# Show the error message in error responses, but never the stack trace
spring.web.error.include-message=always
spring.web.error.include-stacktrace=never
